# Only ecosystems with real checked-in manifests are listed.
# Not listed on purpose:
#   - pip: pypi/pyproject.toml has a placeholder version (0.0.0) stamped at release
#     and no real dependencies to update.
#   - npm: the npm packages are generated at release time; no package.json with
#     dependencies is checked in.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

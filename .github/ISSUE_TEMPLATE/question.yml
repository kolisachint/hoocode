name: Question
description: How do I...? Prefer GitHub Discussions for questions; use this if it does not fit there.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions are welcome. The best place for them is
        [Discussions](https://github.com/kolisachint/hoocode/discussions); you can
        also ask here. If the answer turns out to be hard to find, that is worth fixing too.

  - type: textarea
    id: question
    attributes:
      label: What would you like to know?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What have you tried?
      description: Commands, settings, or docs that didn't answer it.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: hoocode version
      description: Output of `hoocode --version`.
      placeholder: "0.1.41"
    validations:
      required: false

name: Merge Release

# Auto-release when a merged PR carries a rust:patch / rust:minor / rust:major
# label (port of hoocode's npm:* labels and pycortex's pypi:* labels).
#
# Triggered by the push to main, not by pull_request:closed. A pull_request run
# for a fork PR gets a read-only token and no secrets, so the release could not
# push the tag. A push run always has the base repo's token and secrets, and it
# runs the workflow file and code already on main, never code from the PR.
# Labels are read from the API at merge time (not from an event payload).

on:
  push:
    branches: [main]

jobs:
  level:
    # Skip the release bot's own "Release vX" commits.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      level: ${{ steps.pick.outputs.level }}
      skip_gates: ${{ steps.pick.outputs.skip_gates }}
      publish_crates: ${{ steps.pick.outputs.publish_crates }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Merged PR(s) whose merge/squash/rebase commit is this push. Works for
          # fork PRs too. A direct push to main has no PR: nothing to release.
          # The commit-to-PR link can lag (and its embedded labels can be
          # stale) right after a merge: retry for the PR number, then read the
          # labels from the PR itself.
          pr=""
          for attempt in 1 2 3 4 5 6; do
            pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | first | .number // empty')
            [ -n "$pr" ] && break
            [ "$attempt" -lt 6 ] && sleep 10
          done
          labels=""
          if [ -n "$pr" ]; then
            labels=$(gh api "repos/$REPO/issues/$pr/labels" --jq '.[].name')
          fi
          echo "PR: ${pr:-none}"
          echo "labels:"; echo "$labels"
          level=""
          for l in major minor patch; do
            echo "$labels" | grep -qx "rust:$l" && { level="$l"; break; }
          done
          skip_gates=true
          echo "$labels" | grep -qx "release:run-gates" && skip_gates=false
          publish_crates=false
          echo "$labels" | grep -qx "release:crates" && publish_crates=true
          {
            echo "level=$level"
            echo "skip_gates=$skip_gates"
            echo "publish_crates=$publish_crates"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: level
    if: needs.level.outputs.level != ''
    # The called jobs need these; a caller granting less fails at startup.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      level: ${{ needs.level.outputs.level }}
      # release.yml fails if main HEAD is not this commit (main moved on).
      expected_sha: ${{ github.sha }}
      # Gates (ci.yml, re-run) are skipped by default: the PR's CI already ran.
      # Add label release:run-gates to re-run them. Manual dispatch of
      # release.yml runs them (its skip_gates input defaults to false).
      # release:crates (deferred: does nothing yet).
      skip_gates: ${{ needs.level.outputs.skip_gates == 'true' }}
      publish_crates: ${{ needs.level.outputs.publish_crates == 'true' }}
    secrets: inherit

name: CI

# Parallel gates (docs/design/build-speed.md §4.2). Also called by release.yml,
# so a release runs exactly these checks, side by side, before it tags.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 04:17 UTC: nightly evals, the matrix and the soak.
    - cron: "17 4 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  # github.workflow is the caller's name under workflow_call, so a release never
  # cancels (or is cancelled by) the CI run of the same push.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -P ci --locked --workspace --no-fail-fast

  test-macos:
    # Same command as `test`, on macOS (docs/design/reliability.md §1.3): the
    # macOS-only failures (/private temp paths, NFD names, option+ key labels)
    # must not come back. Blocking once it has run green.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -P ci --locked --workspace --no-fail-fast

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doc
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --locked --workspace --no-deps

  test-layout:
    # Guard for build-speed D3: integration tests live in crates/*/tests/it/
    # (one `it` binary per crate), not as one binary per file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          stray=$(find crates -path '*/tests/*.rs' -not -path '*/tests/it/*')
          if [ -n "$stray" ]; then
            echo "integration tests must live under tests/it/:"
            echo "$stray"
            exit 1
          fi

  subagent-evals:
    # Subagent reliability, measured end to end against a scripted mock
    # provider (docs/design/subagent-evals.md). Non-blocking until it has run
    # green on this runner a few times: a wall-clock-sensitive measurement
    # should not be able to block an unrelated PR on its first day.
    # Not on pull_request: runs on the nightly schedule or by hand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: evals
      - run: cargo build --locked -p hoocode-code-main
      - name: Subagent evals (fast suite)
        run: scripts/eval/subagent_evals.py --min-success 0.8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subagent-evals-report
          path: target/subagent-evals/
          retention-days: 14

  subagent-evals-nightly:
    # The long form: every scenario against every fault, then a soak. Too slow
    # for a pull request, cheap enough to run every night.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: evals
      - run: cargo build --locked -p hoocode-code-main
      - name: Fault matrix
        run: scripts/eval/subagent_evals.py --matrix
      - name: Soak (10 minutes, randomised faults, leak check)
        run: scripts/eval/subagent_evals.py --soak 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subagent-evals-nightly
          path: target/subagent-evals/
          retention-days: 14

  firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/check_dep_firewall.py
      # The curl installer runs under any /bin/sh; check it parses under dash too.
      - name: install.sh syntax
        run: |
          sudo apt-get install -y -qq dash >/dev/null
          sh -n install/install.sh
          dash -n install/install.sh

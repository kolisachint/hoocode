name: Release

# Fast path: CI gates (parallel, via ci.yml) → bump + tag + GitHub release →
# binaries for 4 targets in parallel, then SHA256SUMS and npm (binaries.yml).
# crates.io publishing is deferred: publish_crates is accepted but does nothing
# (see docs/design/distribution.md).

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump level"
        required: true
        type: choice
        options: [patch, minor, major]
      skip_gates:
        description: "Skip CI gates (the commit is already green on main)"
        type: boolean
        default: false
      publish_crates:
        description: "Deferred: crates.io publishing is off; this does nothing"
        type: boolean
        default: false
      expected_sha:
        description: "Optional: fail unless main HEAD is exactly this commit"
        type: string
        default: ""
  workflow_call:
    inputs:
      level:
        required: true
        type: string
      expected_sha:
        description: "The PR merge commit; fail unless main HEAD is exactly this"
        type: string
        default: ""
      skip_gates:
        type: boolean
        default: false
      publish_crates:
        type: boolean
        default: false

# Shared with release-tag.yml (same group name) so the two can never run at once
# and race on the version or on pushes to main. cancel-in-progress is false, so
# a running release is never cut short, but GitHub keeps only ONE pending run
# per group: a third arrival cancels the second. A run shown as "cancelled"
# while waiting did not release; dispatch it again once the group is free.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gates:
    if: ${{ !inputs.skip_gates }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  tag:
    needs: gates
    # Run after green gates, or straight away when they were skipped.
    if: ${{ !cancelled() && (needs.gates.result == 'success' || needs.gates.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Main is the merged commit
        # A label-triggered release must ship the PR that was merged. If main
        # moved on (another merge landed while gates ran or the group was busy),
        # HEAD would carry unreviewed-by-this-release commits: stop instead.
        env:
          EXPECTED: ${{ inputs.expected_sha }}
        run: |
          [ -n "$EXPECTED" ] || exit 0
          head=$(git rev-parse HEAD)
          if [ "$head" != "$EXPECTED" ]; then
            echo "::error::main is at $head, but this release was requested for merge commit $EXPECTED. main moved on; nothing was released. Dispatch Release manually (workflow_dispatch) to ship the current main."
            exit 1
          fi
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Bump versions
        id: bump
        run: |
          version=$(python3 scripts/bump_versions.py "${{ inputs.level }}" | tail -1)
          # Keep Cargo.lock in step with the bumped version (workspace members only),
          # so the --locked builds downstream accept it.
          cargo update --workspace
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Commit, tag, push
        run: |
          tag="${{ steps.bump.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $tag"
          git tag "$tag"
          git push origin HEAD:main "$tag"
      - name: GitHub release
        # Created before the binaries so each target uploads as soon as it is built.
        run: gh release create "${{ steps.bump.outputs.tag }}" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result == 'success' }}
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
      id-token: write
    secrets: inherit

  crates:
    # Deferred (docs/design/distribution.md): 34 of 42 crates are unpublished and
    # a first publish hits crates.io rate limits. The label only leaves a note.
    needs: tag
    if: ${{ !cancelled() && needs.tag.result == 'success' && inputs.publish_crates }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::crates.io publishing is deferred; release:crates / publish_crates did nothing."

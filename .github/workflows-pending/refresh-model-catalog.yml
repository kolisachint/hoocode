name: Refresh Model Catalog

# The generated model catalogs are a build-time snapshot of what upstream
# offers, and until now nothing regenerated them: `build` only compiles, and
# `prepublishOnly` runs `clean && build`, not `build:models`. A model added
# upstream reached users only when someone happened to run the generator by
# hand, so every release shipped whatever the catalog looked like on the last
# day a human thought to refresh it.
#
# This runs the generators on a schedule and puts the result up for review
# rather than committing to main, because a catalog refresh can change model
# pricing and context limits and deserves eyes.

on:
  schedule:
    # Weekly, deliberately off the hour: upstream catalogs move on the order of
    # days, and scheduled jobs at :00 queue behind everyone else's.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --strict turns a failed fetch into a failed job. Without it, a blocked
      # or broken upstream falls back to the entries already in the tree, which
      # produces an empty diff and reports success: a frozen catalog looks
      # exactly like an up-to-date one. A red job here means "the refresh did
      # not happen", which is the thing worth knowing.
      - name: Regenerate model catalogs
        working-directory: packages/ai
        run: |
          bun run generate-models -- --strict
          bun run generate-image-models -- --strict

      # The generators emit unformatted output and the committed catalogs are
      # formatted, so without this every refresh arrives buried in whitespace
      # noise and no reviewer can see which models actually changed.
      - name: Format the regenerated catalogs
        run: bunx biome check --write packages/ai/src/models.generated.ts packages/ai/src/image-models.generated.ts

      # The catalogs are TypeScript, not data files: a malformed entry is a
      # compile error. Worth catching here, because a pull request opened with
      # GITHUB_TOKEN does not trigger the CI workflow (GitHub's own loop
      # protection), so nothing else will typecheck this before a human looks.
      - name: Typecheck
        working-directory: packages/ai
        run: bunx tsgo -p tsconfig.build.json --noEmit

      - name: Open a pull request for the changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/refresh-model-catalog
        run: |
          set -euo pipefail

          if git diff --quiet -- packages/ai/src; then
            echo "Catalogs are already up to date; nothing to open."
            exit 0
          fi

          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"

          git checkout -b "$BRANCH"
          git add packages/ai/src/models.generated.ts packages/ai/src/image-models.generated.ts
          git commit -m "Refresh generated model catalogs"

          # The branch belongs entirely to this workflow, and each run supersedes
          # the last: an unreviewed refresh from a week ago is not worth keeping.
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Existing pull request updated."
            exit 0
          fi

          # Written to a file so the body is not indented by this script block.
          cat > /tmp/pr-body.md <<'BODY'
          Regenerated by the `Refresh Model Catalog` workflow from the current upstream
          catalogs (models.dev, OpenRouter, Vercel AI Gateway).

          Review the diff for changed pricing and context limits, not only for added
          models — an upstream price correction lands here the same way a new model does.

          Opened with `GITHUB_TOKEN`, so CI does not start on this pull request by
          itself. Close and reopen it to trigger a run.
          BODY
          sed -i 's/^          //' /tmp/pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Refresh generated model catalogs" \
            --body-file /tmp/pr-body.md

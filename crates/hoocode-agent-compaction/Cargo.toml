[package]
name = "hoocode-agent-compaction"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Session compaction for hoocode agents"
readme = "README.md"

[package.metadata.hoocode]
publish = true

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-agent-harness = { workspace = true }
hoocode-agent-session = { workspace = true }
hoocode-agent-types = { workspace = true }
hoocode-ai-registry = { workspace = true }
hoocode-ai-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["async-await-macro", "std"] }

[dev-dependencies]
hoocode-ai-models = { workspace = true }
hoocode-ai-provider-faux = { workspace = true }
hoocode-code-session = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

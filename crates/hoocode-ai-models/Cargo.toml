[package]
name = "hoocode-ai-models"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "LLM model registry and discovery for hoocode AI"
readme = "README.md"

[package.metadata.hoocode]
publish = true

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-ai-models-catalog = { workspace = true }
hoocode-ai-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

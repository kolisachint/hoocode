[package]
name = "hoocode-code-main"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Main entry point for the hoocode coding agent"
readme = "README.md"

[package.metadata.hoocode]
publish = true

[[bin]]
name = "hoocode"
path = "src/main.rs"

[dependencies]
hoocode-code-cli = { workspace = true }

[dev-dependencies]
insta = "1"
regex = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"

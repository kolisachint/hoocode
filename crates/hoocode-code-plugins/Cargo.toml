[package]
name = "hoocode-code-plugins"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Plugins for the hoocode coding agent: loading Agent Plugins 1.0 and Claude plugin layouts (discovery, precedence, folder trust, and the skills, subagents and MCP servers they contribute), and installing them from git marketplaces"

[package.metadata.hoocode]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-code-mcp = { workspace = true }
hoocode-code-paths = { workspace = true }
hoocode-code-resources = { workspace = true }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
hoocode-code-settings = { workspace = true }
tempfile = "3"

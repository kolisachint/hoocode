[package]
name = "hoocode-ai-oauth-openai-codex"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenAI Codex (ChatGPT Plus/Pro) OAuth flow for hoocode AI"
readme = "README.md"

[package.metadata.hoocode]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-ai-oauth = { workspace = true }
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

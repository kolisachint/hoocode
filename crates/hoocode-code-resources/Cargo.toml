[package]
name = "hoocode-code-resources"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Resources for the hoocode coding agent: skills, prompt templates, slash commands, agent definitions, context files"
readme = "README.md"

[package.metadata.hoocode]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-agent-harness = { workspace = true }
hoocode-code-paths = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
dirs = "5"
glob = "0.3"
sha2 = "0.10"
hoocode-code-settings = { workspace = true }

[dev-dependencies]
tempfile = "3"

[package]
name = "hoocode-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Threads, runtimes, blocking pool, channels, watchdog and memory limits for the hoocode process: the only crate that builds them"
readme = "README.md"

[package.metadata.hoocode]
publish = false

[lib]
# No doctests: the API is exercised by tests/it (build-speed D4).
doctest = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
libc = "0.2"
memory-stats = "1"

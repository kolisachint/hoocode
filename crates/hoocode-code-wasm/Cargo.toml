[package]
name = "hoocode-code-wasm"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WASM extension host for the hoocode coding agent: runs internal-tier plugin components (hoocode:extension@0.1.0) in wasmtime with per-call instances, limits and a gated wasi:http"

[package.metadata.hoocode]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-ai-types = { workspace = true }
hoocode-ai-util = { workspace = true }
hoocode-code-paths = { workspace = true }
hoocode-runtime = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
http = "1"
serde_json = "1"
sha2 = "0.11"
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-http = { workspace = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }
# The connect-to-checked-address send path (src/connect.rs): hyper http1 client
# over a TCP or tokio-rustls stream, with the Host header kept as the original.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
# Test-only: a CA and a leaf certificate for the local https send-path test.
rcgen = "0.14"

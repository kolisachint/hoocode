[package]
name = "echo-ext"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Test fixture: an extension component for hoocode-code-wasm's integration tests. Not shipped."
publish = false

# Not a workspace member of hoocode: it is built for wasm32-wasip2 by
# scripts/dev/build_wasm_fixtures.sh and kept out of the host workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63.0"
# MIT (taken from "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"): the
# wasi:http outgoing-handler bindings for the `fetch` tool.
wasip2 = "1.0.4"

[profile.release]
opt-level = "s"

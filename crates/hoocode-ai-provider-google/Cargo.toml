[package]
name = "hoocode-ai-provider-google"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Google Gemini provider for hoocode AI"
readme = "README.md"

[package.metadata.hoocode]
publish = true

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-ai-env = { workspace = true }
hoocode-ai-models = { workspace = true }
hoocode-ai-types = { workspace = true }
hoocode-ai-util = { workspace = true }
hoocode-ai-stream = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["macros"] }
jsonwebtoken = "9"

[dev-dependencies]
hoocode-ai-stream = { workspace = true, features = ["testing"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

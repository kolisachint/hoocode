[package]
name = "hoocode-code-tui-keybindings"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The coding agent's keyboard map: app keybindings, keybindings.json loading and hint text"
readme = "README.md"

[package.metadata.hoocode]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-code-paths = { workspace = true }
hoocode-code-tui-theme = { workspace = true }
hoocode-tui-keys = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
regex = "1"
tempfile = "3"

[package]
name = "hoocode-code-tool-search"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SearchCodebase for the hoocode coding agent: ranked lexical code search (ripgrep libraries), fusion and reranking"
readme = "README.md"

[package.metadata.hoocode]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-agent-harness = { workspace = true }
hoocode-agent-types = { workspace = true }
hoocode-ai-types = { workspace = true }
hoocode-code-paths = { workspace = true }
hoocode-code-tool-api = { workspace = true }
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

# Byte-index slices of text are a panic risk on multi-byte input (see docs/design/reliability.md, 1.5).
[lints.clippy]
string_slice = "warn"

[package]
name = "hoocode-code-models"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Model registry for the hoocode coding agent: built-in catalog plus models.json custom providers and overrides"
readme = "README.md"

[package.metadata.hoocode]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-ai-types = { workspace = true }
hoocode-ai-models = { workspace = true }
hoocode-code-settings = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
glob = "0.3"

[dev-dependencies]
tempfile = "3"

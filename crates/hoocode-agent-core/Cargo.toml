[package]
name = "hoocode-agent-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core agent runtime for hoocode agents"
readme = "README.md"

[package.metadata.hoocode]
publish = true

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-ai-types = { workspace = true }
hoocode-ai-stream = { workspace = true }
hoocode-agent-types = { workspace = true }
hoocode-agent-loop = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros"] }

[dev-dependencies]
hoocode-ai-provider-faux = { workspace = true }
hoocode-ai-provider-openai = { workspace = true }
hoocode-ai-stream = { workspace = true, features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[package]
name = "hoocode-tui-highlight"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Syntax highlighting for the hoocode TUI: a port of highlight.js 10.7.3 over its own grammars"
readme = "README.md"

[package.metadata.hoocode]
publish = true

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-tui-util = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
serde_json = "1"

# Byte-index slices of text are a panic risk on multi-byte input (see docs/design/reliability.md, 1.5).
[lints.clippy]
string_slice = "warn"

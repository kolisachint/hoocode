[package]
name = "hoocode-code-tools"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Coding tools for the hoocode coding agent"
readme = "README.md"

[package.metadata.hoocode]
publish = true

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-ai-util = { workspace = true }
hoocode-agent-types = { workspace = true }
hoocode-ai-types = { workspace = true }
hoocode-code-tool-api = { workspace = true }
hoocode-code-tools-fs = { workspace = true }
hoocode-code-tool-bash = { workspace = true }
hoocode-code-tool-search = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
glob = "0.3"
ignore = "0.4"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
urlencoding = "2"

[dev-dependencies]
hoocode-code-prompts = { workspace = true }

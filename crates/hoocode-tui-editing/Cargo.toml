[package]
name = "hoocode-tui-editing"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Text editing primitives for the hoocode TUI"
readme = "README.md"

[package.metadata.hoocode]
publish = true

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]

# Byte-index slices of text are a panic risk on multi-byte input (see docs/design/reliability.md, 1.5).
[lints.clippy]
string_slice = "warn"

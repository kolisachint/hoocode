[package]
name = "hoocode-code-auth"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Credential storage for the hoocode coding agent: auth.json API keys and OAuth tokens with locked refresh"
readme = "README.md"

[package.metadata.hoocode]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-ai-types = { workspace = true }
hoocode-ai-env = { workspace = true }
hoocode-ai-oauth = { workspace = true }
hoocode-code-models = { workspace = true }
hoocode-code-paths = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[package]
name = "hoocode-code-capabilities"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Capability index for the hoocode coding agent: BM25 search over loaded skills, subagents and plugins (DocSearch)"
readme = "README.md"

[package.metadata.hoocode]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-code-paths = { workspace = true }
hoocode-code-resources = { workspace = true }

# Byte-index slices of text are a panic risk on multi-byte input (see docs/design/reliability.md, 1.5).
[lints.clippy]
string_slice = "warn"

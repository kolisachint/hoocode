[package]
name = "hoocode-code-rpc"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "RPC mode for the hoocode coding agent"
readme = "README.md"

[package.metadata.hoocode]
publish = true

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-ai-types = { workspace = true }
hoocode-code-agent-session = { workspace = true }
hoocode-code-settings = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "io-util", "sync", "macros", "process", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
hoocode-agent-core = { workspace = true }
hoocode-agent-harness = { workspace = true }
hoocode-agent-types = { workspace = true }
hoocode-ai-provider-faux = { workspace = true }
hoocode-code-models = { workspace = true }
hoocode-code-paths = { workspace = true }
hoocode-code-permissions = { workspace = true }
hoocode-code-session = { workspace = true }
hoocode-code-tool-api = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

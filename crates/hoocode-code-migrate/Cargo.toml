[package]
name = "hoocode-code-migrate"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "One-time merge of the pre-1.2 coding-agent folders into ~/.hoocode"
readme = "README.md"

[package.metadata.hoocode]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-code-auth = { workspace = true }
hoocode-code-paths = { workspace = true }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

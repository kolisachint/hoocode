[package]
name = "hoocode-code-tool-api"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared tool plumbing for the hoocode coding agent: tool definitions, output truncation, path resolution"
readme = "README.md"

[package.metadata.hoocode]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
hoocode-agent-types = { workspace = true }
hoocode-ai-types = { workspace = true }
hoocode-tui-util = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
url = "2"

# Byte-index slices of text are a panic risk on multi-byte input (see docs/design/reliability.md, 1.5).
[lints.clippy]
string_slice = "warn"

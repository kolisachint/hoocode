[workspace.metadata.hoocode]
# Lockstep version bump script uses this as the single source of truth.
# All crates must share the workspace `version` above.

[workspace.metadata.hoocode.source]
# Pinned hoocode snapshot this migration ports from. Changing the pin is a
# deliberate PR; see docs/design/ts-to-rust-migration.md §0.1.
repository = "https://github.com/kolisachint/hoocode-ts"
hoocode-version = "0.6.0"
hoocode-commit = "2223437c99cc4279ad40a39d8ff9268a5c8ee0fd"

# Full debuginfo across ~220 test binaries does not fit a cloud session's disk
# and slows every link; file:line backtraces are kept (build-speed.md D1).
[profile.dev]
debug = "line-tables-only"

# Regex compilation is very slow unoptimized: the markdown renderer's rules
# (tens of patterns) took ~1 s to build on first use in dev builds, which
# delayed the first frame whenever it held markdown. Optimize just these.
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
